name: daily probe

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore RPC history cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: src/generated/rpcHistory.json
          key: rpc-history-${{ github.run_id }}
          restore-keys: |
            rpc-history-

      - name: Ensure rpcHistory.json exists
        run: mkdir -p src/generated && touch src/generated/rpcHistory.json

      - name: Run probe
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          pnpm probe 2>&1 | tee /tmp/probe_out.txt
          commit_msg=$(grep -oP 'COMMIT_MSG=\K.*' /tmp/probe_out.txt)
          echo "$commit_msg" > /tmp/commit_msg.txt

      - name: Check for generated file changes
        id: diff
        run: |
          if git diff --quiet HEAD -- src/generated/rpcUrls.json src/test-blocks.ts 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'ethr-did-auto-config bot'
          git config user.email 'bot@ethr-did-auto-config'
          git add src/generated/rpcUrls.json src/test-blocks.ts
          COMMIT_MSG=$(cat /tmp/commit_msg.txt)
          git commit -m "$COMMIT_MSG"
          git push
